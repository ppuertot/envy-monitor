name: release

# Publica la imagen en Docker Hub al subir un tag `vX.Y.Z` (p. ej. `v0.2.0`):
#   git tag v0.2.0 && git push origin v0.2.0
# También se puede lanzar a mano (workflow_dispatch) para publicar `latest`.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadatos (tags de la imagen)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ppuertot/envy-monitor
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build local (para escanear)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: envy:scan

      - name: Escaneo de vulnerabilidades (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: envy:scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0" # reporta; pon "1" para bloquear el release

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
