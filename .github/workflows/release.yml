name: release

# Publica la imagen en Docker Hub al subir un tag `vX.Y.Z` (p. ej. `v0.2.0`):
#   git tag v0.2.0 && git push origin v0.2.0
# También se puede lanzar a mano (workflow_dispatch) para publicar `latest`.
#
# Una versión ya publicada NO se sobrescribe: si `X.Y.Z` ya existe en Docker Hub,
# el workflow no reconstruye ni republica (así una imagen no cambia bajo la
# misma versión).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Comprobar si la versión ya existe
        id: check
        run: |
          skip=false
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            ver="${GITHUB_REF_NAME#v}"
            if docker manifest inspect "ppuertot/envy-monitor:${ver}" >/dev/null 2>&1; then
              echo "::notice::La versión ${ver} ya existe en Docker Hub; no se republica."
              skip=true
            fi
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"

      - name: Metadatos (tags de la imagen)
        id: meta
        if: steps.check.outputs.skip != 'true'
        uses: docker/metadata-action@v5
        with:
          images: ppuertot/envy-monitor
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build local (para escanear)
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: envy:scan

      - name: Escaneo de vulnerabilidades (Trivy)
        if: steps.check.outputs.skip != 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: envy:scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0" # reporta; pon "1" para bloquear el release

      - name: Build y push
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
