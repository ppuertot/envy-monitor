services:
  envy:
    build: .
    image: envy:latest
    container_name: envy
    ports:
      - "8000:8000"
    environment:
      ENVY_INTERVAL: "2"
      ENVY_WINDOW: "60"
      ENVY_DB: /data/envy.db
      ENVY_RETENTION_DAYS: "7"
      # Seguridad: se toman de .env si existen (ver README → Seguridad)
      ENVY_TOKEN: "${ENVY_TOKEN:-}"
      ENVY_MAX_CLIENTS: "${ENVY_MAX_CLIENTS:-20}"
      ENVY_SHOW_CMDLINE: "${ENVY_SHOW_CMDLINE:-0}"
    volumes:
      - envy-data:/data
    # Docker Compose v2.30+. En versiones anteriores usa el bloque
    # comentado al final (deploy.resources.reservations.devices).
    gpus: all
    restart: unless-stopped
    # Comparte el PID namespace del host para que la pestaña Processes
    # vea los procesos que usan la GPU.
    pid: host
    # Endurecimiento del contenedor
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Límites de recursos y rotación de logs
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# --- Alternativa si `gpus: all` no está soportado ---
#    deploy:
#      resources:
#        reservations:
#          devices:
#            - driver: nvidia
#              count: all
#              capabilities: [utility]

volumes:
  envy-data:
    name: envy-data
