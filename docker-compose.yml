services:
  envy:
    build: .
    image: envy:latest
    container_name: envy
    ports:
      - "8000:8000"
    environment:
      ENVY_INTERVAL: "2"
      ENVY_WINDOW: "60"
      ENVY_DB: /data/envy.db
      ENVY_RETENTION_DAYS: "7"
      # Seguridad (opcionales): ver README → Seguridad
      # ENVY_TOKEN: "cambia-este-token"
      # ENVY_MAX_CLIENTS: "20"
      # ENVY_SHOW_CMDLINE: "0"
    volumes:
      - envy-data:/data
    # Docker Compose v2.30+. En versiones anteriores usa el bloque
    # comentado al final (deploy.resources.reservations.devices).
    gpus: all
    restart: unless-stopped
    # Comparte el PID namespace del host para que la pestaña Processes
    # vea los procesos que usan la GPU.
    pid: host

# --- Alternativa si `gpus: all` no está soportado ---
#    deploy:
#      resources:
#        reservations:
#          devices:
#            - driver: nvidia
#              count: all
#              capabilities: [utility]

volumes:
  envy-data:
    name: envy-data
